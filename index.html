<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M3E Bookmarks</title>
    <style>
        /* === MATERIAL 3 EXPRESSIVE DARK THEME === */
        :root {
            --md-sys-color-background: #1A1C19;
            --md-sys-color-on-background: #E2E3DD;
            --md-sys-color-surface: #2A2C29; 
            --md-sys-color-on-surface: #E2E3DD;
            --md-sys-color-on-surface-variant: #C2C9BD; 
            --md-sys-color-primary: #9CD67D; 
            --md-sys-color-on-primary: #0C3900;
            --md-sys-color-primary-container: #265108;
            --md-sys-color-error: #FFB4AB; 
            --md-sys-color-error-container: #93000A;
            --md-sys-color-outline: #8C9388;
            --md-sys-color-surface-container-highest: #333532;
            
            --radius-large: 28px;
            --radius-medium: 16px;
            --spacing: 12px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* === HEADERS === */
        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px var(--spacing) 10px var(--spacing); gap: 12px;
        }
        .app-title { font-size: 24px; font-weight: 700; color: var(--md-sys-color-primary); margin: 0; }
        .header-title {
            flex: 1; text-align: left; font-weight: 700; font-size: 20px;
            color: var(--md-sys-color-on-surface); white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; margin: 0;
        }

        /* === MAIN VIEWS === */
        .view-container {
            flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0 var(--spacing);
            transition: opacity 0.3s;
        }
        .hidden { display: none !important; }

        .scroll-area {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: var(--spacing);
        }
        .scroll-area::after { content: ""; min-height: 140px; flex-shrink: 0; }

        /* === LIST ITEMS (Standard Horizontal) === */
        .list-btn {
            background-color: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface);
            border: none; border-radius: var(--radius-medium);
            padding: 16px; font-size: 16px; font-weight: 600;
            display: flex; align-items: center; gap: 12px;
            cursor: pointer; text-align: left; text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
            flex-shrink: 0; user-select: none;
        }
        .list-btn:active { transform: scale(0.98); background-color: var(--md-sys-color-surface-container-highest); }
        
        .item-icon { width: 32px; height: 32px; border-radius: 8px; background-color: white; padding: 4px; pointer-events: none; }
        .item-title-container { flex: 1; overflow: hidden; pointer-events: none; }
        .item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .item-url { font-size: 12px; color: var(--md-sys-color-outline); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; margin-top: 4px; font-weight: 400;}

        /* === ARTICLE CARDS (For Hero Images) === */
        .article-card {
            background-color: var(--md-sys-color-surface);
            border-radius: var(--radius-medium);
            display: flex; flex-direction: column;
            text-decoration: none; color: inherit;
            overflow: hidden; transition: transform 0.2s;
            flex-shrink: 0; user-select: none;
        }
        .article-card:active { transform: scale(0.98); }
        .article-img-container {
            width: 100%; height: 200px;
            background-color: var(--md-sys-color-surface-container-highest);
            display: block; flex-shrink: 0; pointer-events: none;
        }
        .article-img { width: 100%; height: 100%; object-fit: cover; }
        .article-content { 
            padding: 16px; display: flex; align-items: center; gap: 12px; 
        }

        /* === ACTIONS === */
        .action-btn { 
            background: transparent; border: none; font-size: 18px; padding: 4px 8px; cursor: pointer; 
        }
        .btn-edit { color: var(--md-sys-color-primary); }
        .btn-delete { color: var(--md-sys-color-error); }

        /* === BOTTOM BAR === */
        #bottom-bar {
            position: fixed; bottom: var(--spacing); left: var(--spacing); right: var(--spacing);
            display: flex; gap: 8px; height: 56px;
        }
        .btn { border: none; border-radius: 100px; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-primary { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); flex: 1;}
        .btn-icon { background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); flex: 0 0 56px; font-size: 20px;}

        /* === MODALS === */
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--md-sys-color-background);
            z-index: 100; display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
            padding: var(--spacing);
        }
        .modal.active { transform: translateY(0); }
        
        .modal-content {
            background-color: var(--md-sys-color-surface);
            border-radius: var(--radius-large); flex: 1; display: flex; flex-direction: column;
            padding: 20px; border: 1px solid var(--md-sys-color-outline);
        }

        .modal-header { font-size: 22px; font-weight: bold; margin-bottom: 24px; color: var(--md-sys-color-primary); }
        .editor-input { 
            background: rgba(0,0,0,0.2); border: 1px solid var(--md-sys-color-outline); 
            color: var(--md-sys-color-on-background); font-family: inherit; font-size: 16px;
            padding: 16px; border-radius: 12px; margin-bottom: 16px; outline: none; width: 100%; 
        }
        .editor-input:focus { border-color: var(--md-sys-color-primary); }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: auto; }
        .text-btn { background: none; border: none; font-weight: bold; font-size: 14px; text-transform: uppercase; cursor: pointer; padding: 8px 16px; }
        .settings-btn { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-primary); border: none; padding: 16px; border-radius: var(--radius-medium); font-size: 16px; font-weight: bold; margin-bottom: 12px; cursor: pointer; }
        
        .empty-state { text-align: center; color: var(--md-sys-color-outline); margin-top: 40px; font-style: italic; }
    </style>
    <!-- Link to the manifest file -->
<link rel="manifest" href="./manifest.json">

<!-- Register the Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(registration => {
          console.log('Service Worker registered successfully');
        })
        .catch(error => {
          console.log('Service Worker registration failed:', error);
        });
    });
  }
</script>
</head>
<body>

    <!-- CATEGORIES VIEW -->
    <div id="view-categories" class="view-container">
        <div class="app-header">
            <h1 class="app-title">Bookmarks</h1>
        </div>
        <div id="category-list" class="scroll-area"></div>
        <div id="bottom-bar">
            <button class="btn btn-icon" onclick="openModal('settings-modal')">&#9881;&#65039;</button>
            <button class="btn btn-primary" onclick="openCategoryModal()">+ Add Category</button>
        </div>
    </div>

    <!-- BOOKMARKS VIEW -->
    <div id="view-bookmarks" class="view-container hidden">
        <div class="app-header">
            <h2 id="current-category-name" class="header-title"></h2>
        </div>
        <div id="bookmark-list" class="scroll-area"></div>
        <div id="bottom-bar">
            <button class="btn btn-icon" onclick="history.back()">&#8592;</button>
            <button class="btn btn-primary" onclick="openBookmarkModal()">+ Add Bookmark</button>
        </div>
    </div>

    <!-- CATEGORY MODAL -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="category-modal-title">Add Category</div>
            <input type="text" id="cat-title-input" class="editor-input" placeholder="Category Name (e.g., Tech News)">
            
            <div class="modal-actions">
                <button class="text-btn" style="color: var(--md-sys-color-error);" onclick="closeModal('category-modal')">CANCEL</button>
                <button class="text-btn" style="color: var(--md-sys-color-primary);" onclick="saveCategory()">SAVE</button>
            </div>
        </div>
    </div>

    <!-- BOOKMARK MODAL -->
    <div id="bookmark-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="bookmark-modal-title">Add Bookmark</div>
            <input type="text" id="bm-title-input" class="editor-input" placeholder="Website Title">
            <input type="url" id="bm-url-input" class="editor-input" placeholder="https://...">
            
            <div class="modal-actions">
                <button class="text-btn" style="color: var(--md-sys-color-error);" onclick="closeModal('bookmark-modal')">CANCEL</button>
                <button class="text-btn" style="color: var(--md-sys-color-primary);" onclick="saveBookmark()">SAVE</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Settings & Data</div>
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
                <p style="color: var(--md-sys-color-on-surface-variant); text-align: center; margin-bottom: 24px;">
                    Export your bookmarks for backup or transfer.
                </p>
                <button class="settings-btn" onclick="exportData()">&#128228; Export Backup (JSON)</button>
                <button class="settings-btn" onclick="document.getElementById('import-file').click()">&#128229; Import Backup</button>
                <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importData(event)">
            </div>
            <div class="modal-actions">
                <button class="text-btn" style="color: var(--md-sys-color-error);" onclick="closeModal('settings-modal')">CLOSE</button>
            </div>
        </div>
    </div>

    <!-- REORDER MODAL -->
    <div id="reorder-modal" class="modal" style="background: rgba(0,0,0,0.7);">
        <div class="modal-content" style="flex: none; margin: auto; height: auto;">
            <div class="modal-header" id="reorder-title" style="justify-content: center;">Reorder</div>
            <button class="text-btn" style="color: var(--md-sys-color-primary); margin-bottom: 12px;" onclick="moveItem(0)">&#9195; Move to Top</button>
            <button class="text-btn" style="color: var(--md-sys-color-primary); margin-bottom: 12px;" onclick="moveItem(-1)">&#8679; Move Up</button>
            <button class="text-btn" style="color: var(--md-sys-color-primary); margin-bottom: 12px;" onclick="moveItem(1)">&#8681; Move Down</button>
            <button class="text-btn" style="color: var(--md-sys-color-primary); margin-bottom: 12px;" onclick="moveItem(999)">&#9196; Move to Bottom</button>
            <button class="text-btn" style="color: var(--md-sys-color-error);" onclick="closeModal('reorder-modal')">&#10006;&#65039; Cancel</button>
        </div>
    </div>

<script>
    // --- STATE MANAGEMENT ---
    let categories = JSON.parse(localStorage.getItem('m3e_bookmarks_data')) || [];
    let currentCategoryId = null;
    let editingCategoryId = null;
    let editingBookmarkId = null;

    // Reorder Variables
    let currentReorderContext = null; // 'category' or 'bookmark'
    let currentReorderIndex = null;
    let longPressTimer;
    let isLongPressing = false;

    // DOM Elements
    const viewCategories = document.getElementById('view-categories');
    const viewBookmarks = document.getElementById('view-bookmarks');
    const categoryList = document.getElementById('category-list');
    const bookmarkList = document.getElementById('bookmark-list');

    // --- INITIALIZATION & ROUTING ---
    function init() {
        if (categories.length === 0) {
            categories.push({ id: Date.now(), title: "General", bookmarks: [] });
            saveToStorage();
        }
        handleRoute();
    }

    window.addEventListener('hashchange', handleRoute);

    function handleRoute() {
        const hash = location.hash;
        if (hash.startsWith('#cat-')) {
            const catId = parseInt(hash.replace('#cat-', ''));
            const category = categories.find(c => c.id === catId);
            if (category) {
                currentCategoryId = catId;
                document.getElementById('current-category-name').innerText = category.title;
                renderBookmarks();
                viewCategories.classList.add('hidden');
                viewBookmarks.classList.remove('hidden');
            } else { location.hash = ''; }
        } else {
            currentCategoryId = null;
            renderCategories();
            viewCategories.classList.remove('hidden');
            viewBookmarks.classList.add('hidden');
        }
    }

    function saveToStorage() { localStorage.setItem('m3e_bookmarks_data', JSON.stringify(categories)); }

    // --- LONG PRESS UTILITIES ---
    function setupLongPress(element, context, index) {
        element.addEventListener('touchstart', (e) => {
            if(e.target.classList.contains('action-btn')) return;
            isLongPressing = false;
            longPressTimer = setTimeout(() => { isLongPressing = true; openReorder(context, index); }, 600);
        });
        element.addEventListener('touchend', () => clearTimeout(longPressTimer));
        element.addEventListener('touchmove', () => clearTimeout(longPressTimer));

        element.addEventListener('mousedown', (e) => {
            if(e.target.classList.contains('action-btn')) return;
            isLongPressing = false;
            longPressTimer = setTimeout(() => { isLongPressing = true; openReorder(context, index); }, 600);
        });
        element.addEventListener('mouseup', () => clearTimeout(longPressTimer));
        element.addEventListener('mouseleave', () => clearTimeout(longPressTimer));
    }

    function openReorder(context, index) {
        currentReorderContext = context;
        currentReorderIndex = index;
        document.getElementById('reorder-title').innerText = context === 'category' ? 'Reorder Category' : 'Reorder Bookmark';
        openModal('reorder-modal');
    }

    function moveItem(direction) {
        const idx = currentReorderIndex;
        if (idx === null) return;

        let targetArray = currentReorderContext === 'category' ? categories : categories.find(c => c.id === currentCategoryId).bookmarks;
        if (targetArray.length < 2) return;

        const item = targetArray.splice(idx, 1)[0];
        
        if (direction === 0) targetArray.unshift(item); 
        else if (direction === 999) targetArray.push(item); 
        else {
            let newIdx = idx + direction;
            if (newIdx < 0) newIdx = 0;
            if (newIdx > targetArray.length) newIdx = targetArray.length;
            targetArray.splice(newIdx, 0, item);
        }
        
        saveToStorage();
        if (currentReorderContext === 'category') renderCategories();
        else renderBookmarks();
        
        closeModal('reorder-modal');
    }

    // --- CATEGORY LOGIC ---
    function renderCategories() {
        categoryList.innerHTML = '';
        if (categories.length === 0) {
            categoryList.innerHTML = '<div class="empty-state">No categories yet. Add one below!</div>';
            return;
        }

        categories.forEach((cat, index) => {
            const btn = document.createElement('div');
            btn.className = 'list-btn';
            btn.innerHTML = `
                <div class="item-title-container">
                    <span class="item-title">📁 ${escapeHtml(cat.title)}</span>
                    <span class="item-url">${cat.bookmarks.length} saved links</span>
                </div>
                <button class="action-btn btn-edit" onclick="openCategoryModal(${cat.id}, event)">✏️</button>
                <button class="action-btn btn-delete" onclick="deleteCategory(${cat.id}, event)">✖</button>
            `;

            setupLongPress(btn, 'category', index);

            btn.onclick = (e) => {
                if (isLongPressing) { isLongPressing = false; return; }
                if(!e.target.classList.contains('action-btn')) location.hash = `cat-${cat.id}`;
            };
            categoryList.appendChild(btn);
        });
    }

    function openCategoryModal(id = null, event = null) {
        if(event) event.stopPropagation();
        editingCategoryId = id;
        const titleEl = document.getElementById('category-modal-title');
        const inputEl = document.getElementById('cat-title-input');
        
        if (id) {
            titleEl.innerText = "Edit Category";
            inputEl.value = categories.find(c => c.id === id).title;
        } else {
            titleEl.innerText = "Add New Category";
            inputEl.value = "";
        }
        openModal('category-modal');
    }

    function saveCategory() {
        const title = document.getElementById('cat-title-input').value.trim();
        if(!title) { alert("Please enter a category name."); return; }
        
        if (editingCategoryId) {
            const cat = categories.find(c => c.id === editingCategoryId);
            if(cat) cat.title = title;
        } else {
            categories.push({ id: Date.now(), title, bookmarks: [] });
        }
        
        saveToStorage(); renderCategories(); closeModal('category-modal');
    }

    function deleteCategory(id, event) {
        event.stopPropagation();
        if(confirm("Delete this category and all its bookmarks?")) {
            categories = categories.filter(c => c.id !== id);
            saveToStorage(); renderCategories();
        }
    }

    // --- BOOKMARK LOGIC ---
    async function fetchHeroImage(bookmarkObj) {
        // Silently fetch hero image in background
        try {
            const proxyUrl = `https://rss-proxy.slaterjohn2.workers.dev/?url=${encodeURIComponent(bookmarkObj.url)}&type=hero`;
            const res = await fetch(proxyUrl);
            const data = await res.json();
            
            if (data.heroImage) {
                bookmarkObj.heroImage = data.heroImage;
                saveToStorage();
                // Only re-render if user is still looking at the bookmarks view
                if (!viewBookmarks.classList.contains('hidden')) renderBookmarks();
            }
        } catch(e) { console.log('No hero image found or fetch failed.', e); }
    }

    function renderBookmarks() {
        bookmarkList.innerHTML = '';
        const category = categories.find(c => c.id === currentCategoryId);
        
        if (!category || category.bookmarks.length === 0) {
            bookmarkList.innerHTML = '<div class="empty-state">No bookmarks in this category.</div>';
            return;
        }

        category.bookmarks.forEach((bm, index) => {
            const btn = document.createElement('a');
            btn.href = bm.url;
            btn.target = "_blank"; 

            // Switch layout depending on whether a hero image exists
            if (bm.heroImage) {
                btn.className = 'article-card';
                btn.innerHTML = `
                    <div class="article-img-container">
                        <img src="${bm.heroImage}" class="article-img" loading="lazy" onerror="this.parentElement.style.display='none'">
                    </div>
                    <div class="article-content">
                        <div class="item-title-container">
                            <span class="item-title">${escapeHtml(bm.title)}</span>
                            <span class="item-url">${escapeHtml(bm.url)}</span>
                        </div>
                        <button class="action-btn btn-edit" onclick="openBookmarkModal(${bm.id}, event)">✏️</button>
                        <button class="action-btn btn-delete" onclick="deleteBookmark(${bm.id}, event)">✖</button>
                    </div>
                `;
            } else {
                let domain = "google.com";
                try { domain = new URL(bm.url).hostname; } catch(e) {}
                const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

                btn.className = 'list-btn';
                btn.innerHTML = `
                    <img src="${iconUrl}" class="item-icon" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzg4OCI+PHBhdGggZD0iTTEyIDJDNi40OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bS0xIDE3Ljkydi0yLjAxaDMuMDF2Mi4wMUgxMXptMC00LjI5di0yLjAxaDMuMDF2Mi4wMUgxMXptMC00LjI5di0yLjAxaDMuMDF2Mi4wMUgxMXoiLz48L3N2Zz4='">
                    <div class="item-title-container">
                        <span class="item-title">${escapeHtml(bm.title)}</span>
                        <span class="item-url">${escapeHtml(bm.url)}</span>
                    </div>
                    <button class="action-btn btn-edit" onclick="openBookmarkModal(${bm.id}, event)">✏️</button>
                    <button class="action-btn btn-delete" onclick="deleteBookmark(${bm.id}, event)">✖</button>
                `;
            }

            setupLongPress(btn, 'bookmark', index);
            
            btn.onclick = (e) => {
                if (isLongPressing) { e.preventDefault(); isLongPressing = false; return; }
            };

            bookmarkList.appendChild(btn);
        });
    }

    function openBookmarkModal(id = null, event = null) {
        if(event) { event.stopPropagation(); event.preventDefault(); }
        editingBookmarkId = id;
        
        const modalTitle = document.getElementById('bookmark-modal-title');
        const titleInput = document.getElementById('bm-title-input');
        const urlInput = document.getElementById('bm-url-input');
        
        if (id) {
            modalTitle.innerText = "Edit Bookmark";
            const category = categories.find(c => c.id === currentCategoryId);
            const bm = category.bookmarks.find(b => b.id === id);
            titleInput.value = bm.title;
            urlInput.value = bm.url;
        } else {
            modalTitle.innerText = "Add Bookmark";
            titleInput.value = ""; urlInput.value = "";
        }
        openModal('bookmark-modal');
    }

    function saveBookmark() {
        const title = document.getElementById('bm-title-input').value.trim();
        let url = document.getElementById('bm-url-input').value.trim();
        
        if(!title || !url) { alert("Please enter both a title and a URL."); return; }
        if(!url.startsWith('http://') && !url.startsWith('https://')) { url = 'https://' + url; }
        
        const category = categories.find(c => c.id === currentCategoryId);
        
        if (editingBookmarkId) {
            const bm = category.bookmarks.find(b => b.id === editingBookmarkId);
            if(bm) {
                bm.title = title;
                if(bm.url !== url) {
                    bm.url = url;
                    bm.heroImage = null; // Reset image if URL changed
                    fetchHeroImage(bm);
                }
            }
        } else {
            const newBm = { id: Date.now(), title, url, heroImage: null };
            category.bookmarks.push(newBm);
            fetchHeroImage(newBm); // Fetch image in background
        }
        
        saveToStorage(); renderBookmarks(); closeModal('bookmark-modal');
    }

    function deleteBookmark(id, event) {
        event.stopPropagation(); event.preventDefault(); 
        if(confirm("Delete this bookmark?")) {
            const category = categories.find(c => c.id === currentCategoryId);
            category.bookmarks = category.bookmarks.filter(b => b.id !== id);
            saveToStorage(); renderBookmarks();
        }
    }

    // --- UTILS & MODALS ---
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

    // --- BACKUP & SYNC ---
    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(categories));
        const downloadNode = document.createElement('a');
        downloadNode.setAttribute("href", dataStr);
        downloadNode.setAttribute("download", "bookmarks_backup.json");
        document.body.appendChild(downloadNode);
        downloadNode.click();
        downloadNode.remove();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if(Array.isArray(imported)) {
                    // SMART MERGE LOGIC
                    imported.forEach(impCat => {
                        // Look for an existing category with the same title
                        let existingCat = categories.find(c => c.title === impCat.title);
                        
                        if (existingCat) {
                            // Category exists, merge the bookmarks
                            impCat.bookmarks.forEach(impBm => {
                                // Only add the bookmark if the URL isn't already in this category
                                if (!existingCat.bookmarks.some(b => b.url === impBm.url)) {
                                    existingCat.bookmarks.unshift(impBm);
                                }
                            });
                        } else {
                            // Category doesn't exist, add the whole thing
                            categories.push(impCat);
                        }
                    });

                    saveToStorage(); 
                    handleRoute(); 
                    closeModal('settings-modal');
                    alert("Bookmarks imported and merged successfully!");
                }
            } catch (err) { alert("Invalid backup file."); }
        };
        reader.readAsText(file);
        event.target.value = ''; 
    }

    // Boot
    init();
</script>
</body>
</html>
